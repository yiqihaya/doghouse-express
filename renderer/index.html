<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快递管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 侧边栏 -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1 class="sidebar-title">📦 快递管理</h1>
      </div>
      <button id="btn-add" class="btn btn-primary btn-full">＋ 新增快递</button>
      <nav class="date-nav">
        <div class="date-nav-header">📅 按日期筛选</div>
        <ul id="date-list">
          <li class="date-item active" data-date="all">全部</li>
        </ul>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main id="main">
      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="搜索收件人、电话、取件码、快递编号..." autocomplete="off">
          <button id="btn-clear-search" class="btn-clear" style="display:none;">✕</button>
        </div>
      </div>
      <div id="content">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">📭</div>
          <p class="empty-text">还没有快递记录</p>
          <p class="empty-hint">点击左侧"＋ 新增快递"开始使用</p>
        </div>
      </div>
    </main>
  </div>

  <!-- 弹窗 -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal" id="modal-box">
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
